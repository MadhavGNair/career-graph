# Install with `uv run pre-commit install`. Hooks use the project's own pinned tools via uv.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pii-guard
        name: personal-data guard
        entry: uv run python -m careergraph.devtools.pii_guard
        language: system
        pass_filenames: false
