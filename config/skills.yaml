# Skill normalisation. Deterministic, no LLM: every skill found in your profile or a posting is
# mapped to one canonical name, so "py", "Python3" and "python" count as the same skill.
# Canonical names are lowercase. Matching is case-insensitive on whole words.

# canonical name -> other spellings | mapping of name -> list of aliases | {}
# A canonical name always matches itself; list only the extra spellings.
aliases:
  python: [py, python3]
  pytorch: [torch]
  tensorflow: [tf, keras]
  jax: [flax]
  scikit-learn: [sklearn, scikit learn]
  pandas: []
  numpy: []
  sql: [postgresql, postgres, mysql, sqlite]
  spark: [pyspark, apache spark]
  airflow: [apache airflow]
  kubernetes: [k8s, k3s, eks, gke, aks]
  docker: [containers, containerisation, containerization]
  aws: [amazon web services, sagemaker]
  gcp: [google cloud, vertex ai, bigquery]
  azure: []
  mlops: [ml ops, model deployment, ml platform]
  llm: [llms, large language models, large language model, generative ai, genai]
  langchain: []
  langgraph: []
  rag: [retrieval augmented generation, retrieval-augmented generation]
  nlp: [natural language processing]
  computer vision: [cv, image recognition]
  recommender systems: [recommender system, recommendation systems, recommenders, recsys]
  time series: [forecasting, time-series]
  deep learning: [neural networks]
  machine learning: [ml]
  statistics: [statistical modelling, statistical modeling, statistical analysis, statistical analyses, a/b testing, a/b test, experimentation]
  fastapi: []
  rust: []
  go: [golang]
  java: []
  scala: []
  typescript: [ts]
  terraform: [infrastructure as code, iac]
  ci/cd: [github actions, gitlab ci, continuous integration]
  mlflow: []
  dbt: []
  kafka: [apache kafka]
  vector databases: [pgvector, faiss, qdrant, weaviate, pinecone]
  evaluation: [evals, llm evaluation, model evaluation]
  german: [deutsch]
  c++: [cpp]
  ros: [robot operating system]
  operations research: [optimization, mixed integer programming]
  react: [react.js, reactjs]
  phd: [doctorate, ph.d.]

# canonical skill -> related canonical skills. A related skill earns partial credit
# (criteria.yaml related_skill_credit) when the exact one is missing. | mapping | {}
related:
  pytorch: [tensorflow, jax]
  tensorflow: [pytorch, jax]
  jax: [pytorch, tensorflow]
  aws: [gcp, azure]
  gcp: [aws, azure]
  azure: [aws, gcp]
  airflow: [dbt]
  spark: [pandas]
  langgraph: [langchain]
  langchain: [langgraph]
  rag: [vector databases, llm]
  kubernetes: [docker]
  mlflow: [mlops]
  go: [rust]
  rust: [go]
  java: [scala]
  scala: [java]
