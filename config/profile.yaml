# Who you are (LIVE mode). Demo mode reads data/demo/profile/profile.yaml instead.
# Identity facts here are injected into documents VERBATIM and are never generated by an LLM.
# The verifier checks drafts against these exact employer names, degrees and dates.
# Every key: what it does | allowed values | default.

identity:
  # Your full name | text | (required)
  name: "Your Name"
  # One-line headline under your name | text | ""
  headline: "Machine Learning Engineer"
  # Contact email shown on the CV | text | ""
  email: "you@example.com"
  # Phone shown on the CV; leave empty to omit | text | ""
  phone: ""
  # City, Country | text | ""
  location: "City, Country"
  # Links shown on the CV, label -> URL | mapping | {}
  links: {}
  # Languages you speak; used for language fit and dealbreakers.
  # code = ISO 639-1 (en, de, fr...) | level: native, fluent, professional, intermediate, basic
  languages:
    - code: en  # ISO 639-1 language code
      # Proficiency | native, fluent, professional, intermediate, basic | professional
      level: fluent

# Work history, newest first. Dates are YYYY-MM; end may be "present".
experience: []
#  - employer: Example GmbH        # exact legal/common name | text | (required)
#    title: ML Engineer            # job title | text | (required)
#    start: "2021-04"              # YYYY-MM | (required)
#    end: present                  # YYYY-MM or present | present
#    location: Berlin, Germany     # text | ""

# Degrees, newest first.
education: []
#  - institution: Example University   # text | (required)
#    degree: MSc                       # text | (required)
#    field: Computer Science           # text | ""
#    start: "2016-10"                  # YYYY-MM | ""
#    end: "2018-09"                    # YYYY-MM | ""

# Documents to ingest (CV, motivation letters, notes). Parsed locally, never uploaded except
# as LLM input for extraction in live mode.
documents:
  # Folder with your documents (gitignored) | path | profiles/me
  dir: profiles/me
  # File patterns to read | list of globs (.pdf .md .txt .tex supported) | ["*.pdf", "*.md", "*.txt", "*.tex"]
  include: ["*.pdf", "*.md", "*.txt", "*.tex"]
  # Hand-editable evidence file inside dir; items with pinned: true are never overwritten | filename | evidence.yaml
  evidence_file: evidence.yaml

# Public GitHub profile to ingest (non-fork repos, languages, topics, README excerpts).
github:
  # GitHub username; null to skip | text or null | null
  username: null
  # Max repos to read, most recently pushed first | 0-100 | 10
  max_repos: 10
  # README characters kept per repo (cost: these become extraction input) | >=0 | 3000
  readme_max_chars: 3000
