[project]
name = "careergraph"
version = "0.1.0"
description = "LangGraph job-search copilot: profile -> jobs -> match -> human shortlist -> grounded CV/letter drafts -> LaTeX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastembed>=0.9.1,<0.10",
    "feedparser>=6.0.14,<7",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1.6,<4",
    "langchain>=1.5.2,<2",
    "langchain-anthropic>=1.7.12,<2",
    "langchain-core>=1.8.4,<2",
    "langgraph>=1.2.24,<1.3",
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "numpy>=2.5.5,<3",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "pypdf>=7.1.1,<8",
    "pyyaml>=6.0.4,<7",
    "rank-bm25>=0.2.2,<0.3",
    "rich>=15.0.0,<16",
    "sqlalchemy>=2.1.9,<2.2",
    "streamlit>=1.67.0,<2",
    "typer>=0.29.2,<0.30",
]

[project.scripts]
careergraph = "careergraph.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careergraph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ui"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "S603",   # subprocess with explicit args list (LaTeX compile) is intended
    "S607",   # tools (git, tectonic, pdflatex) are resolved from PATH on purpose
    "N818",   # ConfigErrors is a collection, not a single error
    "RUF001", "RUF002", "RUF003",  # unicode in fixtures/docstrings is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "E501"]
"ui/**" = ["N999"]

[tool.pyright]
include = ["src", "tests", "ui"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: end-to-end tests (demo smoke)",
    "network: requires internet (never run in CI)",
    "postgres: requires CAREERGRAPH_TEST_POSTGRES_URL",
]
filterwarnings = [
    # ToolRuntime carries our runtime context object; pydantic warns when serialising it.
    "ignore:Pydantic serializer warnings:UserWarning",
]
