# ArgoCD Application for CareerGraph. Replace REPLACE_ME with your fork's URL after you push.
# Secrets are NOT managed here: create `careergraph-secrets` in the namespace yourself
# (kubectl, sealed-secrets, external-secrets...).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: careergraph
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/careergraph.git
    targetRevision: main
    path: deploy/helm/careergraph
    helm:
      valueFiles:
        - values.yaml
        - values-cheap.yaml
      parameters:
        - name: image.repository
          value: ghcr.io/REPLACE_ME/careergraph
  destination:
    server: https://kubernetes.default.svc
    namespace: careergraph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
