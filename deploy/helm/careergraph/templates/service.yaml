{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cg.name" . }}
  labels: {{- include "cg.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "cg.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
