# Scheduled security scans. Action versions verified 2026-11-22.
# trivy-action is pinned to a commit SHA: its tags were hijacked in March 2026
# (GHSA-69fq-xp46-6x23); immutable releases from 0.35.0 were unaffected.
name: security
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Audit locked dependencies
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Filesystem scan (deps, misconfig, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: careergraph:scan
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: careergraph:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization accounts.
